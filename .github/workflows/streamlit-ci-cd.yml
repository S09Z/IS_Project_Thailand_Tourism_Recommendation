  # 🛠️ Linting, Formatting, and Security Checks
  lint-and-test:
    # needs: review-and-security
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Setup Poetry
        uses: threeal/setup-poetry-action@v1.1.0
        with:
          version: 1.5.1
          cache: true
      - run: poetry --version
      
      - name: 🔍 Check Poetry Version
        run: poetry --version
      
      - name: 📥 Install Dependencies
        run: poetry install --no-interaction --no-ansi

      - name: 🔎 Run Flake8 Linter
        run: poetry run flake8 app

      - name: 🎨 Run Black (Code Formatter)
        run: poetry run black --check app

      - name: 🛡️ Run Security Check (Bandit)
        run: poetry run bandit -r app

      - name: 🧪 Run Tests with Coverage
        run: poetry run pytest --cov=app --cov-report=xml

  # 🐳 Build Docker Image and Debug
  build-and-debug:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔎 Debug Docker Build Context
        run: ls -R

      - name: 🐳 Build Docker Image
        run: docker build --no-cache -t my-streamlit-app .

      - name: 🔎 Test Docker Container
        run: docker run --rm my-streamlit-app streamlit --version
